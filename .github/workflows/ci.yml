name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefer-offline --no-audit --fund=false
      - run: npm audit --package-lock-only --offline --audit-level=high
      - run: npm run check
      - run: npm run pack:dry
      - run: npm run cli:packed-smoke
      - name: Run mandatory CLI certification on Node 24
        if: matrix.node == 24
        run: |
          npm run cli:human-audit
          npm run cli:exhaustive
          npm run cli:certify
          npm run cli:certify:packed

  check-platforms:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --prefer-offline --no-audit --fund=false
      - run: npm run check
      - run: npm run pack:dry
      - run: npm run cli:packed-smoke
