name: CLI flow audit patch

on:
  push:
    branches:
      - fix/cli-flow-audit-v7-5-2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/cli-flow-audit-v7-5-2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/apply-cli-flow-audit-patch.mjs
      - name: Commit deterministic patch
        run: |
          if git diff --quiet; then
            echo 'No setup.ts patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/setup.ts
          git commit -m 'fix: repair canonical bare setup apply flow'
          git push origin HEAD:fix/cli-flow-audit-v7-5-2
