name: Publish to npm

# Fallback path only: fires on `release: published`, which only happens for a release created by
# a real human (web UI, or `gh release create` run with a personal token) — GitHub does not fire
# that event for releases created by another workflow's default GITHUB_TOKEN, which is how
# .github/workflows/release.yml creates its releases. The normal, automated path publishes
# in-process at the end of release.yml itself; this workflow exists only in case someone ever
# creates a GitHub Release by hand for this package. Uses npm's Trusted Publishing (OIDC): no
# NPM_TOKEN secret exists in this repository. npm exchanges this workflow's GitHub Actions OIDC
# identity for a short-lived publish token, authorized only for the exact provider (owner/repo/
# workflow file) configured as a Trusted Publisher on npmjs.com for this package — see
# docs/publishing.md for that one-time, manual npmjs.com setup step, which no workflow in this
# repository can perform on its own.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: '!github.event.release.prerelease'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) requires npm CLI >= 11.5.1; pin to latest rather than trust
      # whatever version the runner's Node 22 image happens to bundle.
      - name: Ensure npm CLI supports Trusted Publishing (OIDC)
        run: npm install -g npm@latest

      - run: npm ci

      - name: Verify package.json version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg_version="$(node -e "console.log(require('./package.json').version)")"
          tag_version="${TAG#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::package.json version ($pkg_version) does not match release tag ($TAG) — refusing to publish"
            exit 1
          fi

      - run: npm run check
      - run: npm run pack:dry

      - name: Publish to npm
        run: npm publish --access public --provenance
