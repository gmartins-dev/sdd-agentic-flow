name: Release

# Runs only after ci.yml has completed successfully on main — never on a red CI run, because
# this workflow only starts once ci.yml has already finished.
#
# Tag/GitHub-release creation and npm publish are gated INDEPENDENTLY, not by one shared
# condition — deliberately, after a real incident (v1.6.2): a retry (`gh run rerun --failed`)
# re-executes the whole job from scratch, and a naive single "should_release" gate based only on
# tag existence would skip `npm publish` on that retry too, because the tag from the failed
# attempt's earlier, already-succeeded step still exists. Tag/release creation is gated on tag
# non-existence (below); npm publish is gated on the exact version not already being on the npm
# registry (see "Check whether this version is already on npm"); GitHub Packages publish is
# gated separately on the scoped package not already being on npm.pkg.github.com.
#
# npm publish runs in THIS SAME job, right after tag/release creation, rather than in a separate
# workflow listening for `release: published`. That was the original design, but it does not
# work for the tag/release created below: GitHub does not fire `release: published` (or any
# other webhook event) for actions taken with the default GITHUB_TOKEN, specifically to prevent
# recursive workflow triggering. Publishing in-process sidesteps that limitation entirely and
# needs no stored secret either way (see the Trusted Publishing / OIDC step below). npmjs.com
# allows only one Trusted Publisher per package, registered to this workflow's filename
# (release.yml) — see docs/publishing.md.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build

      - name: Read package.json version
        id: pkg
        run: echo "version=$(node -e "console.log(require('./package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Find latest existing release tag
        id: latest_tag
        run: echo "tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Decide whether package.json is a new, unreleased version
        id: decide
        run: |
          result="$(node -e "
            const { compareVersions, parseVersion } = require('./dist/version-compat.js');
            const [pkgVersion, latestTag] = process.argv.slice(1);
            const latestVersion = latestTag ? latestTag.replace(/^v/, '') : null;
            if (!parseVersion(pkgVersion)) {
              console.error(\`package.json version '\${pkgVersion}' is not a valid x.y.z version\`);
              process.exit(2);
            }
            console.log(!latestVersion || compareVersions(pkgVersion, latestVersion) > 0 ? 'true' : 'false');
          " "${{ steps.pkg.outputs.version }}" "${{ steps.latest_tag.outputs.tag }}")"
          echo "should_release=$result" >> "$GITHUB_OUTPUT"

      - name: Check whether this exact tag already exists
        id: tag_exists
        run: |
          version="${{ steps.pkg.outputs.version }}"
          if git rev-parse "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether this version is already published on npm
        id: npm_check
        run: |
          version="${{ steps.pkg.outputs.version }}"
          if npm view "sdd-agentic-flow@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether this version is already on GitHub Packages
        id: gpr_check
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.pkg.outputs.version }}"
          if npm view "@gmartins-dev/sdd-agentic-flow@${version}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Guards tag/release creation AND npm publish: an accidental package.json bump with no
      # matching changelog entry should never produce either. Runs unconditionally (cheap, local
      # grep) so its result is available on a retry too, not only on the version's first attempt.
      - name: Require a matching CHANGELOG.md section (guards against an accidental bump)
        id: changelog
        run: |
          if npx tsx scripts/extract-changelog-section.ts "${{ steps.pkg.outputs.version }}" > /tmp/release-notes.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::package.json is at ${{ steps.pkg.outputs.version }} but CHANGELOG.md has no matching '## ${{ steps.pkg.outputs.version }}' section — skipping tag/release and npm publish. If this version bump was intentional, add the changelog entry and push again."
          fi

      - name: Create annotated tag and GitHub release
        if: steps.decide.outputs.should_release == 'true' && steps.tag_exists.outputs.exists == 'false' && steps.changelog.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.pkg.outputs.version }}"
          tag="v${version}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag" "${{ github.event.workflow_run.head_sha }}"
          git push origin "$tag"
          gh release create "$tag" --title "$tag" --notes-file /tmp/release-notes.md

      # This version is "legit" to publish if it's either the version freshly detected as new
      # this run (should_release), or a tag already exists for it (a retry picking up after tag
      # creation succeeded but npm publish didn't, in an earlier attempt) — but NOT some older,
      # already-superseded version that merely never made it to npm for an unrelated reason.
      - name: Decide whether npm publish should run
        id: should_publish
        run: |
          if [[ "${{ steps.npm_check.outputs.published }}" == "false" \
                && "${{ steps.changelog.outputs.found }}" == "true" \
                && ( "${{ steps.decide.outputs.should_release }}" == "true" \
                     || "${{ steps.tag_exists.outputs.exists }}" == "true" ) ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether GitHub Packages publish should run
        id: should_publish_gpr
        run: |
          if [[ "${{ steps.gpr_check.outputs.published }}" == "false" \
                && "${{ steps.changelog.outputs.found }}" == "true" \
                && ( "${{ steps.decide.outputs.should_release }}" == "true" \
                     || "${{ steps.tag_exists.outputs.exists }}" == "true" ) ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted Publishing (OIDC) requires npm CLI >= 11.5.1; pin to latest rather than trust
      # whatever version the runner's Node 22 image happens to bundle.
      - name: Ensure npm CLI supports Trusted Publishing (OIDC)
        if: steps.should_publish.outputs.value == 'true'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.should_publish.outputs.value == 'true' || steps.should_publish_gpr.outputs.value == 'true'
        run: npm ci

      - name: Sanity-check the package contents before publishing
        if: steps.should_publish.outputs.value == 'true' || steps.should_publish_gpr.outputs.value == 'true'
        run: npm run pack:dry

      - name: Publish to npm
        if: steps.should_publish.outputs.value == 'true'
        run: npm publish --access public --provenance

      - name: Publish to GitHub Packages
        if: steps.should_publish_gpr.outputs.value == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: bash ./scripts/publish-github-packages.sh
